<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <h1>📝 My Tasks</h1>

  <div class="form-group">
    <div class="row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add</button>
    </div>
    <div class="row">
      <input type="date" id="dateInput" />
    </div>
  </div>

  <div class="filters">
    <button class="active" onclick="setFilter('all', this)">All</button>
    <button onclick="setFilter('active', this)">Active</button>
    <button onclick="setFilter('done', this)">Done</button>
    <button onclick="setFilter('today', this)">Today</button>
    <button onclick="setFilter('overdue', this)">Missed</button>
  </div>

  <ul id="taskList"></ul>

  <div class="footer">
    <span id="taskCount">0 tasks left</span>
    <button class="clear-btn" onclick="clearDone()">Clear completed</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
